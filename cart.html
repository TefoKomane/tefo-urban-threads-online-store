<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Urban Threads</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbrand">Urban Threads</div>
        <div class="navlinks">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html" id="cartLink">Cart</a>
            <a href="login.html" id="loginLink">Log In</a>
            <span id="userDisplay"></span>
            <button id="logoutBtn" style="display:none;">Log Out</button>
        </div>
    </nav>

    <main class="container">
        <h1>Your Cart</h1>
        <div id="emptyCart" style="display:none;">
            <p>Your cart is empty. <a href="shop.html">Continue shopping</a></p>
        </div>
        <table id="cartTable" style="display:none;">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="cartSummary">
            <h2 id="cartTotal">Total: $0.00</h2>
            <button id="checkoutBtn" class="btn">Checkout</button>
        </div>
    </main>

    <footer class="footer">
        <p>Urban Threads 2026. Built by Tefo Karabo Komane</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase_config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
